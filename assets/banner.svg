<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72">
        <animate attributeName="stop-color" values="#1e3c72;#2a5298;#1e3c72" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2a5298">
        <animate attributeName="stop-color" values="#2a5298;#1e3c72;#2a5298" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15" ry="15"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Awesome Route Optimization
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </text>
  <circle cx="100" cy="100" r="10" fill="#ff9900">
    <animate attributeName="cx" values="100;700;100" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>
